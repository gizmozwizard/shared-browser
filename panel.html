<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body>
<header><h2>Shared Browser</h2><small>Browse together, independently</small></header>
<section id="setup"><label>Your name<input id="name" placeholder="Your name" maxlength="40"></label><label>Room ID<input id="room" placeholder="Create or paste room ID"></label><label>WebSocket server<input id="server" value="ws://localhost:8787"></label><button id="join">Join / create room</button><p class="hint">Rooms are temporary. Share the room ID with friends.</p></section>
<section id="workspace" hidden><div class="roomline"><span id="roomLabel"></span><button id="copy">Copy invite</button></div><div id="status">Connecting...</div><h3>People <span id="count"></span></h3><div id="people"></div><h3>Shared tabs</h3><div class="actions"><button id="share">Share current tab</button><button id="refresh">Refresh</button></div><div id="tabs"></div><button class="secondary" id="leave">Leave room</button></section>
<script src="panel.js"></script></body></html>
